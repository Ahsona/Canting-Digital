<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Batik Prototype</title>

    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <!-- Canvas Script -->
    <script src="sketch.js" defer></script>
  </head>

  <body>
    <!-- Left column: Tools and tool settings -->
    <div class = "leftColumn">
      <!-- Tool Bar-->
      <div class = "toolPanel">
        <div class = "sidepanel">
          <div class = "panelHeader">
            <img class = "icon" src = "images/HamburgerIcon.png">
            <h5>Tools</h5>    
          </div>
          <hr>
          <div class = "toolOptions">
            <button class = "tool" id = "pencilTool"><img class = "pencil" src = "images/PencilTool.png"></button>
            <button class = "tool" id = "eraserTool"><img class = "eraser" src = "images/EraserTool.png"></button>
            <hr>
            <hr>
            <button class = "tool selected" id = "cantingTool"><img class = "canting" id = "canting1" src = "images/CantingTool1.png"></button>
            <button class = "tool" id = "paintDabberTool"><img class = "paintdabber" src = "images/PaintDabberTool.png"></button>
          </div>
        </div>
      </div>
      <!-- Tool Property Bar -->
      <!-- Pencil Properties -->
      <div id = "pencilProperties">
        <div class = "sidepanel">
          <div class = "panelHeader">
            <img class = "icon" src = "images/HamburgerIcon.png">
            <h5>Tool Property</h5>    
          </div>
          <hr>
          <div class = "toolProperties">
            <h5>Pencil Size</h5>
            <div class = "brushSizeContainer">
              <input type="range" min="1" max="3" value="2" class="brushSize" id="pencilSizeSlider">
              <span class="brushSizeValue">2</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Eraser Properties -->
      <div id = "eraserProperties">
        <div class = "sidepanel">
          <div class = "panelHeader">
            <img class = "icon" src = "images/HamburgerIcon.png">
            <h5>Tool Property</h5>    
          </div>
          <hr>
          <div class = "toolProperties">
            <h5>Eraser Size</h5>
            <div class = "brushSizeContainer">
              <input type="range" min="1" max="20" value="10" class="brushSize" id="eraserSizeSlider">
              <span class="brushSizeValue">10</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Canting Properties -->
      <div id = "cantingProperties">
        <div class = "sidepanel">
          <div class = "panelHeader">
            <img class = "icon" src = "images/HamburgerIcon.png">
            <h5>Tool Property</h5>    
          </div>
          <hr>
          <div class = "toolProperties">
            <h5>Nozzle Size</h5>
            <div class = "brushSizeContainer">
              <input type="range" min="1" max="5" value="3" class="brushSize" id="cantingSizeSlider">
              <span class="brushSizeValue">3</span>
            </div>
            <h5>Nozzle Type</h5>
            <div class = "nozzleTypeContainer">
              <button class = "nozzleType selected"><img id = "nozzleType1" src = "images/NozzleType1.png"></button>
              <button class = "nozzleType"><img id = "nozzleType2" src = "images/NozzleType2.png"></button>
              <button class = "nozzleType"><img id = "nozzleType3" src = "images/NozzleType3.png"></button>
              <button class = "nozzleType"><img id = "nozzleType4" src = "images/NozzleType4.png"></button>
            </div>
          </div>
        </div>
      </div>
      <!-- Paint Dabber Properties -->
      <div id = "paintDabberProperties">
        <div class = "sidepanel">
          <div class = "panelHeader">
            <img class = "icon" src = "images/HamburgerIcon.png">
            <h5>Tool Property</h5>    
          </div>
          <hr>
          <div class = "toolProperties">
            <h5>Paint Size</h5>
            <div class = "brushSizeContainer">
              <input type="range" min="1" max="100" value="25" class="brushSize" id="paintDabberSizeSlider">
              <span class="brushSizeValue">25</span>
            </div>
            <h5>Paint Color</h5>
            <div class = "colorPickerContainer">
              <input type="color" value="#0523b8" id="colorPicker">
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- The Canvas-->
    <div id = "canvasWrapper">
      <div id = "canvasContainer"></div>
      <div id="steamOverlay"></div>
    </div>
    <!-- Right column: Layer bar -->
    <div class = "rightColumn">
      <div>
        <button id="resetButton" class="layerButton">Reset</button>
        <button id="downloadButton" class="layerButton">Download</button>
      </div>
      <!-- Layers Bar-->
      <div class = "sidepanel">
        <div class = "panelHeader">
          <img class = "icon" src = "images/HamburgerIcon.png">
          <h5>Layers</h5>    
        </div>
        <hr>
        <div class = "layersContainer">
          <div class = "layerHeader">
            <h5>Wax Layer</h5>
            <button class = "layerButton" id="removeWaxButton">Remove Wax</button>
            <!-- <button class = "addLayer" id="addWaxLayerButton"><b>+</b></button> -->
          </div>
          <!-- <div class = "layers" id = "waxLayerUI">
            <button class = "viewLayer" id = "waxVisibility"><img src = "images/OpenEyeIcon.png"></button>
            <div class = "layerThumbnail" id = "waxThumbnail"></div>
          </div> -->
          <div id="waxLayersContainer"></div>
          <hr>
          <div class = "layerHeader">
            <h5>Color Layer</h5>
            <!-- <button class = "layerButton" id="fixColorButton">Fix Color</button> -->
            <!-- <button class = "addLayer"><b>+</b></button> -->
          </div>
          <!-- <div class = "layers" id = "paintLayerUI">
            <button class = "viewLayer" id = "paintVisibility"><img src = "images/OpenEyeIcon.png"></button>
            <div class = "layerThumbnail" id = "paintThumbnail"></div>
          </div> -->
          <div id="paintLayersContainer"></div>
          <hr>
          <div class = "layerHeader">
            <h5>Sketch Layer</h5>
            <div id = "sketchButtonsContainer">
              <button class="addLayer" id="insertImage">
                <img src="images/InsertImage.png">
              </button>
              <button class = "addLayer" id = "addSketchLayerButton"><b>+</b></button>
            </div>
          </div>
          <div class = "opacityContainer">
              <div id = "opacityIcon"><img src = "images/TransparencyIcon.png"></div>
              <input type="range" min="0" max="100" value="100" class="opacity" id="opacitySlider">
              <span class="opacityValue">100%</span>
            </div>
          <!-- <div class = "layers" id = "sketchLayerUI">
            <button class = "viewLayer" id = "sketchVisibility"><img src = "images/OpenEyeIcon.png"></button>
            <div class = "layerThumbnail" id = "sketchThumbnail"></div>
          </div> -->
          <div id="sketchLayersContainer"></div>
        </div>
      </div>
    </div>
        <!-- Pattern Library Modal -->
    <div id="patternLibraryModal" class="modalOverlay">
      <div class="patternLibrary">
        <!-- Header -->
        <div class="patternLibraryHeader">
          <h3>Insert Image</h3>
          <button id="closePatternLibrary">&times;</button>
        </div>
        <hr>
        <!-- Pattern Grid -->
        <div id="patternGrid" class="patternGrid"></div>
        <!-- Footer -->
        <div class="patternLibraryFooter">
          <button id="cancelPatternButton">
            Cancel
          </button>
          <button id="insertPatternButton" disabled>
            Insert
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
